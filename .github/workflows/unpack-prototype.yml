name: unpack-prototype
on:
  workflow_dispatch:
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble tgz, extract, commit
        run: |
          set -euo pipefail
          : > /tmp/proto.b64
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            printf '%s' "$(tr -d '\n\r' < .push-staging/$name)" >> /tmp/proto.b64
          done < .push-staging/FILELIST.txt
          base64 -d /tmp/proto.b64 > /tmp/proto.tgz
          tar -xzf /tmp/proto.tgz
          rm -rf .push-staging
          rm -f probe_encoding.txt probe.png probe2.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short | head -50
          git commit -m "feat: Empires offline-full + visual skin v1 (HTML+Godot+assets)" || echo "nothing"
          git push
